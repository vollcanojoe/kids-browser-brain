<!DOCTYPE html>
<!--
  Kids Browser player page — part of the brain (kids-browser-brain repo),
  served over HTTPS by GitHub Pages so the YouTube embed iframe carries a
  real Referer (a locally generated page has no origin, and YouTube refuses
  referer-less embeds with "Video player configuration error" / Error 153).

  Contract: player.html?v=<videoId>[&t=<title>]
  The app (v2.1+) loads this page in the WebView when a shelf video is
  tapped; this page builds the privacy-enhanced embed for that one video.
  rel=0 (owner's rule): the player's end-screen related videos stay within
  the same channel. The referrerpolicy keeps the Referer origin-only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p { color: #ddd; font-family: sans-serif; font-size: 17px; padding: 22px; }
</style>
</head>
<body>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var v = params.get('v') || '';
  var t = params.get('t');
  if (t) { document.title = t; }
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(v)) {
    var p = document.createElement('p');
    p.textContent = 'This video could not be loaded.';
    document.body.appendChild(p);
    return;
  }
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/' + v + '?rel=0&playsinline=1';
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
  f.setAttribute('allowfullscreen', '');
  document.body.appendChild(f);
})();
</script>
</body>
</html>
